<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DocuFlow</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#e2e6ee;--nv:#0f2547;--bl:#2563eb;--ok:#15803d;--er:#b91c1c;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--card:#172033;--tx:#e6ebf5;--mu:#93a0b5;--bd:#2a3550;--nv:#0a1630}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--nv);color:#cfd8ea;padding:14px 8px;flex-shrink:0}nav b{display:block;color:#fff;font-size:18px;padding:4px 10px 12px}
nav a{display:block;padding:7px 10px;border-radius:8px;cursor:pointer;color:#cfd8ea}nav a:hover,nav a.on{background:rgba(255,255,255,.12);color:#fff}
main{flex:1;padding:18px;min-width:0}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.top h2{margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k{font-size:22px;font-weight:700}.m{color:var(--mu);font-size:12px}
button,.btn{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}button.s{background:transparent;color:var(--bl);border:1px solid var(--bd)}button.d{background:var(--er)}button.o{background:var(--ok)}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}label{font-size:12px;color:var(--mu);display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mu)}td.r,th.r{text-align:right}
.b{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}.b.Approved{background:#dcfce7;color:var(--ok)}.b.Rejected,.b.Cancelled{background:#fee2e2;color:var(--er)}.b.Returned{background:#fef3c7;color:var(--wa)}
.err{color:var(--er);font-size:12px}#pv{display:none}
@media(max-width:700px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:2px}nav b{display:none}nav a{white-space:nowrap}}
@media print{#app{display:none}#pv{display:block!important}body{background:#fff}}
#pv{background:#fff;color:#111;padding:20px;max-width:780px;margin:auto;position:relative}#pv.rc{max-width:300px;font-size:11px}#pv table th,#pv table td{border-bottom:1px solid #ccc;color:#111}
.wm{position:absolute;top:40%;left:15%;font-size:80px;color:rgba(200,0,0,.12);transform:rotate(-25deg);pointer-events:none}
</style></head><body><div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="pv"></div>
<script>
const T={PO:{n:'Purchase Order',p:'PO',pl:'Supplier',src:'suppliers',f:[['deliv','Delivery date','date'],['terms','Payment terms','text'],['ship','Shipping','number'],['other','Additional charges','number']]},
INV:{n:'Sales Invoice',p:'INV',pl:'Customer',src:'customers',hsn:1,f:[['due','Due date','date'],['terms','Payment terms','text'],['paid','Amount already paid','number']]},
BILL:{n:'Customer Bill',p:'BILL',pl:'Customer (optional)',src:'customers',opt:1,f:[['fmt','Bill format','select:Retail receipt,Detailed business bill']]},
QUO:{n:'Quotation',p:'QUO',pl:'Customer',src:'customers',f:[['valid','Valid until','date'],['acc','Accepted by customer','select:No,Yes']]},
REC:{n:'Payment Receipt',p:'REC',pl:'Customer',src:'customers',rec:1,f:[['inv','Related invoice','inv'],['amt','Amount received','number'],['method','Payment method','select:Cash,UPI,NEFT,RTGS,IMPS,Cheque,Card,Bank Transfer'],['txn','Transaction ID','text']]}};
const NAV=[['dash','Dashboard'],['create','Create Document'],['L:PO','Purchase Orders'],['L:INV','Sales Invoices'],['L:BILL','Customer Bills'],['L:QUO','Quotations'],['L:REC','Payment Receipts'],['customers','Customers'],['suppliers','Suppliers'],['products','Products & Services'],['appr','Approval Centre'],['hist','Document History'],['rep','Reports'],['set','Settings'],['users','User Management']];
const GST=/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/,today=()=>new Date().toISOString().slice(0,10);
let db;try{db=JSON.parse(localStorage.getItem('docuflow'))}catch(x){}
db=db||{co:{name:'',gstin:'',addr:'',logo:'',levels:1},users:[{n:'Admin User',r:'Admin',d:'Administrator'},{n:'Maker User',r:'Maker',d:'Executive'},{n:'Checker User',r:'Checker',d:'Accounts Manager'},{n:'Approver User',r:'Approver',d:'Director'}],me:0,customers:[],suppliers:[],products:[],docs:[],seq:{},sigs:{}};
const save=()=>{try{localStorage.setItem('docuflow',JSON.stringify(db))}catch(x){alert('Storage full – remove large images.')}};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=id=>document.getElementById(id);
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),me=()=>db.users[db.me],can=r=>me().r==='Admin'||me().r===r;
let view='dash',cur=null,flt={q:'',t:'',s:''};
function go(v){view=v;cur=null;render()}
function render(){$('nav').innerHTML='<b>DocuFlow</b>'+NAV.map(([k,l])=>`<a class="${k===view?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
const m=$('main');if(cur)return form(m);
if(view==='dash')dash(m);else if(view==='create')m.innerHTML=hd('Create Document')+'<div class="g">'+Object.keys(T).map(t=>`<div class="card"><b>${T[t].n}</b><p class="m">Dedicated form, calculations and PDF template</p><button onclick="newDoc('${t}')">Create</button></div>`).join('')+'</div>';
else if(view.startsWith('L:'))list(m,view.slice(2));else if(view==='hist')list(m,'');else if(view==='appr')appr(m);else if(view==='rep')rep(m);else if(view==='set')sett(m);else if(view==='users')users(m);else master(m,view)}
const hd=(t,x='')=>`<div class="top"><h2>${t}</h2><span class="m">Acting as</span><select style="width:auto" onchange="db.me=+this.value;save();render()">${db.users.map((u,i)=>`<option value="${i}" ${i===db.me?'selected':''}>${e(u.n)} (${u.r})</option>`).join('')}</select>${x}</div>`;
// ---------- calculations
function calc(d){const t=T[d.type];if(t.rec){return{sub:+d.f.amt||0,tax:0,cg:0,sg:0,ig:0,ship:0,other:0,grand:+d.f.amt||0}}
let sub=0,tax=0;d.items.forEach(i=>{const b=(+i.q||0)*(+i.p||0)*(1-(+i.d||0)/100);sub+=b;tax+=b*(+i.g||0)/100});
const intra=!d.party.gstin||!db.co.gstin||d.party.gstin.slice(0,2)===db.co.gstin.slice(0,2),ship=+d.f.ship||0,other=+d.f.other||0;
return{sub,tax,cg:intra?tax/2:0,sg:intra?tax/2:0,ig:intra?0:tax,ship,other,grand:sub+tax+ship+other,intra}}
const paidOf=d=>(+d.f.paid||0)+db.docs.filter(r=>r.type==='REC'&&r.status==='Approved'&&r.f.inv===d.id).reduce((a,r)=>a+(+r.f.amt||0),0);
const outst=d=>Math.max(0,calc(d).grand-paidOf(d)),pstat=d=>{const o=outst(d);return o<=0.005?'Paid':paidOf(d)>0?'Partial':'Unpaid'};
// ---------- dashboard
function dash(m){const D=db.docs,sum=(t)=>D.filter(d=>d.type===t&&d.status==='Approved').reduce((a,d)=>a+calc(d).grand,0),inv=D.filter(d=>d.type==='INV'&&d.status==='Approved');
const mo={};D.forEach(d=>{const k=d.date.slice(0,7);mo[k]=(mo[k]||0)+1});const mx=Math.max(1,...Object.values(mo));
const K=[['Total documents',D.length],['Pending',D.filter(d=>['Submitted','Under Review'].includes(d.status)).length],['Approved',D.filter(d=>d.status==='Approved').length],['Rejected',D.filter(d=>d.status==='Rejected').length],['Invoice value',inr(sum('INV'))],['Outstanding',inr(inv.reduce((a,d)=>a+outst(d),0))],['Pending quotations',D.filter(d=>d.type==='QUO'&&!['Approved','Rejected','Cancelled'].includes(d.status)||d.type==='QUO'&&d.status==='Approved'&&!D.some(i=>i.from===d.id)).length],['PO value',inr(sum('PO'))]];
m.innerHTML=hd('Dashboard')+'<div class="g">'+K.map(([a,b])=>`<div class="card"><div class="m">${a}</div><div class="k">${b}</div></div>`).join('')+'</div>'+
`<div class="g"><div class="card"><b>Documents per month</b>${Object.keys(mo).sort().map(k=>`<div class="m">${k}</div><div style="background:var(--bl);height:10px;border-radius:5px;width:${mo[k]/mx*100}%"></div>`).join('')||'<p class="m">No data yet</p>'}</div>
<div class="card"><b>By type</b>${Object.keys(T).map(t=>`<div>${T[t].n}: <b>${D.filter(d=>d.type===t).length}</b></div>`).join('')}</div>
<div class="card"><b>By status</b>${['Draft','Submitted','Under Review','Approved','Returned','Rejected','Cancelled'].map(s=>`<div>${s}: <b>${D.filter(d=>d.status===s).length}</b></div>`).join('')}</div></div>
<div class="card"><b>Recent documents</b>${tbl(D.slice(-6).reverse())}</div>`;
if(!D.length&&!db.customers.length)m.innerHTML+='<div class="card">Empty workspace. <button onclick="sample()">Load sample masters</button> <span class="m">(adds sample customer, supplier, products only)</span></div>'}
function sample(){db.co={...db.co,name:db.co.name||'Acme Traders Pvt Ltd',gstin:db.co.gstin||'27AAPFU0939F1ZV',addr:db.co.addr||'12 MG Road, Mumbai, Maharashtra 400001'};
db.customers.push({id:'c'+Date.now(),name:'Bright Retail LLP',gstin:'27AABCB1234C1Z5',addr:'Pune, Maharashtra'},{id:'c'+Date.now()+1,name:'Delta Exports',gstin:'29AABCD5678E1Z2',addr:'Bengaluru, Karnataka'});
db.suppliers.push({id:'s'+Date.now(),name:'Metro Supplies',gstin:'27AAACM1111A1Z9',addr:'Thane, Maharashtra',bank:'HDFC 0000 (sample)'});
db.products.push({id:'p'+Date.now(),name:'Laptop Stand',code:'LS-01',hsn:'8473',price:1500,gst:18},{id:'p'+Date.now()+1,name:'Consulting (hour)',code:'SVC-01',hsn:'998313',price:2000,gst:18});save();render()}
// ---------- list
function tbl(rows){return`<div class="tw"><table><tr><th>No.</th><th>Type</th><th>Party</th><th>Date</th><th class="r">Amount</th><th>Created by</th><th>Status</th><th>Payment</th><th></th></tr>${rows.map(d=>`<tr><td>${e(d.no||'(draft)')}</td><td>${T[d.type].n}</td><td>${e(d.party.name||'-')}</td><td>${d.date}</td><td class="r">${inr(calc(d).grand)}</td><td>${e(d.by)}</td><td><span class="b ${d.status}">${d.status}</span></td><td>${d.type==='INV'?pstat(d):'-'}</td><td><button class="s" onclick="open_('${d.id}')">View</button></td></tr>`).join('')||'<tr><td colspan=9 class="m">No documents</td></tr>'}</table></div>`}
function list(m,t){const q=flt.q.toLowerCase();let rows=db.docs.filter(d=>(!t||d.type===t)&&(!flt.s||d.status===flt.s)&&(!flt.t||d.type===flt.t)&&(!q||(d.no+d.party.name+d.by).toLowerCase().includes(q)));
m.innerHTML=hd(t?T[t].n+'s':'Document History',t?`<button onclick="newDoc('${t}')">+ New</button>`:'<button class="s" onclick="csv()">Export CSV</button>')+`<div class="card"><div class="g"><input placeholder="Search number, party, user" value="${e(flt.q)}" oninput="flt.q=this.value;list($('main'),'${t}')">${t?'':`<select onchange="flt.t=this.value;render()"><option value="">All types</option>${Object.keys(T).map(k=>`<option value="${k}" ${flt.t===k?'selected':''}>${T[k].n}</option>`).join('')}</select>`}<select onchange="flt.s=this.value;render()"><option value="">All statuses</option>${['Draft','Submitted','Under Review','Approved','Returned','Rejected','Cancelled'].map(s=>`<option ${flt.s===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="card">${tbl(rows)}</div>`;
const i=m.querySelector('input');if(i&&document.activeElement!==i&&flt.q){i.focus();i.setSelectionRange(99,99)}}
function csv(rows=db.docs.map(d=>[d.no,T[d.type].n,d.party.name,d.date,calc(d).grand.toFixed(2),d.by,d.status])){const c=[['Number','Type','Party','Date','Amount','Creator','Status'],...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='docuflow.csv';a.click()}
// ---------- masters
const MF={customers:[['name','Name'],['gstin','GSTIN'],['addr','Address']],suppliers:[['name','Name'],['gstin','GSTIN'],['addr','Address'],['bank','Payment / bank info']],products:[['name','Name'],['code','Code'],['hsn','HSN/SAC'],['price','Unit price'],['gst','GST %']]};
function master(m,k){const F=MF[k];m.innerHTML=hd(NAV.find(n=>n[0]===k)[1])+`<div class="card"><div class="g">${F.map(([f,l])=>`<div><label>${l}</label><input id="m_${f}"></div>`).join('')}</div><p id="me" class="err"></p><button onclick="addM('${k}')">Add</button></div><div class="card tw"><table><tr>${F.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${db[k].map((r,i)=>`<tr>${F.map(f=>`<td>${e(r[f[0]])}</td>`).join('')}<td><button class="s d" onclick="db['${k}'].splice(${i},1);save();render()">Delete</button></td></tr>`).join('')}</table></div>`}
function addM(k){const r={id:k[0]+Date.now()};MF[k].forEach(([f])=>r[f]=$('m_'+f).value.trim());let er='';if(!r.name)er='Name required.';if(k!=='products'&&r.gstin&&!GST.test(r.gstin.toUpperCase()))er='Invalid GSTIN format.';if(k==='products'&&(isNaN(r.price)||r.price<0||isNaN(r.gst)))er='Price and GST % must be numbers.';
if(er)return $('me').textContent=er;if(r.gstin)r.gstin=r.gstin.toUpperCase();db[k].push(r);save();render()}
// ---------- doc form
function newDoc(t){if(!can('Maker'))return alert('Only Maker or Admin can create documents.');cur={id:'d'+Date.now(),type:t,no:'',status:'Draft',date:today(),party:{},items:[{}],f:{},by:me().n,audit:[],sig:{},created:Date.now()};if(t==='INV'||t==='PO')cur.f.terms='Net 30';view='create';render()}
function open_(id){const d=db.docs.find(x=>x.id===id);if(d.status==='Draft'||d.status==='Returned'){if(!can('Maker'))return detail(d);cur=JSON.parse(JSON.stringify(d));render()}else detail(d)}
function form(m){const d=cur,t=T[d.type],c=calc(d),inv=db.docs.filter(x=>x.type==='INV'&&x.status==='Approved');
const fld=([k,l,ty])=>`<div><label>${l}</label>${ty.startsWith('select')?`<select onchange="cur.f.${k}=this.value;sync()">${ty.slice(7).split(',').map(o=>`<option ${d.f[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:ty==='inv'?`<select onchange="cur.f.inv=this.value;pickInv(this.value)"><option value="">Select approved invoice</option>${inv.map(i=>`<option value="${i.id}" ${d.f.inv===i.id?'selected':''}>${e(i.no)} – ${e(i.party.name)} (due ${inr(outst(i))})</option>`).join('')}</select>`:`<input type="${ty}" value="${e(d.f[k]??'')}" oninput="cur.f.${k}=this.value;sync()">`}</div>`;
m.innerHTML=hd((d.no?'Edit ':'New ')+t.n)+`<div class="card"><div class="g"><div><label>${t.pl}</label><select onchange="pickParty(this.value)"><option value="">${t.opt?'Walk-in / none':'Select saved record'}</option>${db[t.src].map(r=>`<option value="${r.id}" ${d.party.id===r.id?'selected':''}>${e(r.name)}</option>`).join('')}</select></div>
<div><label>Name</label><input value="${e(d.party.name||'')}" oninput="cur.party.name=this.value"></div><div><label>GSTIN</label><input value="${e(d.party.gstin||'')}" oninput="cur.party.gstin=this.value.toUpperCase()"></div><div><label>Address</label><input value="${e(d.party.addr||'')}" oninput="cur.party.addr=this.value"></div>
<div><label>Date</label><input type="date" value="${d.date}" oninput="cur.date=this.value"></div>${t.f.map(fld).join('')}</div></div>
${t.rec?'':`<div class="card tw"><table><tr><th>Item</th>${t.hsn?'<th>HSN/SAC</th>':''}<th>Qty</th><th>Unit price</th><th>Disc %</th><th>GST %</th><th class="r">Line total</th><th></th></tr>${d.items.map((i,n)=>`<tr><td><input list="pl" value="${e(i.name||'')}" onchange="pickProd(${n},this.value)" style="min-width:150px"></td>${t.hsn?`<td><input value="${e(i.hsn||'')}" oninput="cur.items[${n}].hsn=this.value" style="width:90px"></td>`:''}${['q','p','d','g'].map(k=>`<td><input type="number" min="0" step="any" value="${i[k]??''}" oninput="cur.items[${n}].${k}=this.value;sync()" style="width:85px"></td>`).join('')}<td class="r" id="lt${n}"></td><td><button class="s" onclick="cur.items.splice(${n},1);if(!cur.items.length)cur.items=[{}];render()">✕</button></td></tr>`).join('')}</table><datalist id="pl">${db.products.map(p=>`<option>${e(p.name)}`).join('')}</datalist><button class="s" onclick="cur.items.push({});render()">+ Add row</button></div>`}
<div class="card" id="tot"></div><p class="err" id="ve"></p><button onclick="saveDoc(false)">Save draft</button> <button class="o" onclick="saveDoc(true)">Save & submit</button> <button class="s" onclick="saveDoc(false,true)">Preview</button> <button class="s" onclick="cur=null;render()">Cancel</button>`;sync()}
function sync(){const c=calc(cur);cur.items.forEach((i,n)=>{const x=$('lt'+n);if(x)x.textContent=inr((+i.q||0)*(+i.p||0)*(1-(+i.d||0)/100)*(1+(+i.g||0)/100))});
$('tot').innerHTML=`<div class="g"><div>Subtotal<br><b>${inr(c.sub)}</b></div>${c.intra===false?`<div>IGST<br><b>${inr(c.ig)}</b></div>`:`<div>CGST<br><b>${inr(c.cg)}</b></div><div>SGST<br><b>${inr(c.sg)}</b></div>`}${cur.type==='PO'?`<div>Shipping+other<br><b>${inr(c.ship+c.other)}</b></div>`:''}<div>Grand total<br><b class="k">${inr(c.grand)}</b></div>${cur.type==='INV'?`<div>Outstanding<br><b>${inr(Math.max(0,c.grand-(+cur.f.paid||0)))}</b></div>`:''}</div>`}
function pickParty(id){const t=T[cur.type],r=db[t.src].find(x=>x.id===id);cur.party=r?{id:r.id,name:r.name,gstin:r.gstin,addr:r.addr}:{};render()}
function pickProd(n,name){const p=db.products.find(x=>x.name===name),i=cur.items[n];i.name=name;if(p){i.hsn=p.hsn;i.p=p.price;i.g=p.gst;i.q=i.q||1}render()}
function pickInv(id){const i=db.docs.find(x=>x.id===id);if(i){cur.party={...i.party};cur.f.amt=outst(i).toFixed(2)}render()}
function validate(d){const t=T[d.type],er=[];if(!t.opt&&!d.party.name)er.push(t.pl+' is required');if(d.party.gstin&&!GST.test(d.party.gstin))er.push('Party GSTIN is invalid');if(db.co.gstin&&!GST.test(db.co.gstin))er.push('Company GSTIN in Settings is invalid');if(!db.co.name)er.push('Set company name in Settings');if(!d.date)er.push('Date required');
if(t.rec){const i=db.docs.find(x=>x.id===d.f.inv);if(!i)er.push('Select an approved related invoice');else if(!(+d.f.amt>0))er.push('Amount must be > 0');else if(+d.f.amt>outst(i)+0.005)er.push('Amount exceeds outstanding '+inr(outst(i)));if(!d.f.method)er.push('Select payment method');if(d.f.method&&d.f.method!=='Cash'&&!d.f.txn)er.push('Transaction ID required for non-cash payments')}
else{if(!d.items.some(i=>i.name))er.push('Add at least one item');d.items.forEach((i,n)=>{if(i.name&&(!(+i.q>0)||!(+i.p>=0)||i.d>100||i.g<0||i.q<0))er.push('Row '+(n+1)+': check quantity, price, discount (≤100), GST')});}
if(d.f.due&&d.f.due<d.date)er.push('Due date is before invoice date');if(d.f.deliv&&d.f.deliv<d.date)er.push('Delivery date is before PO date');if(d.f.valid&&d.f.valid<d.date)er.push('Validity is before quotation date');if(d.f.paid&&(+d.f.paid<0||+d.f.paid>calc(d).grand))er.push('Amount paid must be between 0 and total');return er}
function saveDoc(submit,prev){const er=validate(cur);if(er.length)return $('ve').innerHTML=er.map(e).join('<br>');
const t=T[cur.type];if(!cur.no){const y=new Date().getFullYear(),fy=new Date().getMonth()>2?y:y-1,k=t.p+fy;db.seq[k]=(db.seq[k]||0)+1;cur.no=`${t.p}/${fy}-${String(fy+1).slice(2)}/${String(db.seq[k]).padStart(4,'0')}`}
const i=db.docs.findIndex(x=>x.id===cur.id);log(cur,i<0?'Created draft':'Edited draft');if(i<0)db.docs.push(cur);else db.docs[i]=cur;const d=cur;save();cur=null;
if(submit)act(d.id,'submit');else if(prev){detail(d);prevDoc(d)}else{view='L:'+d.type;render()}}
function log(d,a,c=''){d.audit.push({u:me().n,r:me().r,t:new Date().toLocaleString(),a,c})}
// ---------- workflow
function detail(d){view='create';const m=$('main');const A=acts(d);
m.innerHTML=hd(`${T[d.type].n} ${e(d.no)} <span class="b ${d.status}">${d.status}</span>`,`<button class="s" onclick="prevDoc(db.docs.find(x=>x.id==='${d.id}'))">Preview / Print PDF</button><button class="s" onclick="go('L:${d.type}')">Back</button>`)+
`<div class="card"><b>${e(d.party.name||'-')}</b> · ${d.date} · <b>${inr(calc(d).grand)}</b>${d.type==='INV'?` · ${pstat(d)} (outstanding ${inr(outst(d))})`:''}${d.from?`<br><span class="m">Converted from a linked document</span>`:''}</div>
<div class="card">${A.length?`<input id="cm" placeholder="Comment (required for return / reject)" style="margin-bottom:8px">`+A.map(([k,l,c])=>`<button class="${c||''}" onclick="act('${d.id}','${k}',$('cm').value)">${l}</button>`).join(' '):'<span class="m">No actions available for your role/status.</span>'}
<p id="ae" class="err"></p></div><div class="card"><b>Audit history</b><div class="tw"><table>${d.audit.map(a=>`<tr><td>${a.t}</td><td>${e(a.u)} (${a.r})</td><td>${a.a}</td><td>${e(a.c)}</td></tr>`).join('')}</table></div></div>`}
function acts(d){const s=d.status,r=me().r,A=[],mk=can('Maker'),ck=can('Checker'),ap=can('Approver'),simple=db.co.levels<2;
if(mk&&s==='Returned')A.push(['edit','Edit & resubmit']);if(mk&&['Submitted','Returned'].includes(s))A.push(['cancel','Cancel','d']);
if(ck&&s==='Submitted'&&!simple)A.push(['review','Start review / mark checked']);
if(ap&&(s==='Under Review'||s==='Submitted'&&simple))A.push(['approve','Approve & apply my signature','o']);
if((ck||ap)&&['Submitted','Under Review'].includes(s))A.push(['return','Return for correction','s']);if(ap&&['Submitted','Under Review'].includes(s))A.push(['reject','Reject','d']);
if(s==='Approved'){if(d.type==='QUO'&&d.f.acc==='Yes'&&mk)A.push(['toINV','Convert to Sales Invoice']);if(d.type==='INV'&&mk)A.push(['toREC','Create Payment Receipt']);if(d.type==='BILL'&&mk)A.push(['toREC','Create Payment Receipt'])}
A.push(['dup','Duplicate','s']);return A}
function act(id,a,c=''){const d=db.docs.find(x=>x.id===id),ok=acts(d).some(x=>x[0]===a)||a==='submit'&&can('Maker')&&['Draft','Returned'].includes(d.status),er=t=>{view='create';detail(d);if($('ae'))$('ae').textContent=t};
if(!ok)return alert('Not permitted for your role or this status.');if(['return','reject'].includes(a)&&!c.trim())return er('Comment is required.');
const sg=()=>{const s=db.sigs[me().n];return s?{name:me().n,desig:me().d,img:s}:{name:me().n,desig:me().d,img:''}};
if(a==='edit'){cur=JSON.parse(JSON.stringify(d));return render()}
if(a==='dup'){const n={...JSON.parse(JSON.stringify(d)),id:'d'+Date.now(),no:'',status:'Draft',by:me().n,audit:[],sig:{},date:today(),created:Date.now(),from:undefined};delete n.from;if(n.type==='REC')n.f.inv=n.f.inv;db.docs.push(n);log(n,'Duplicated from '+d.no);cur=n;db.docs=db.docs.filter(x=>x!==n);return render()}
if(a==='toINV'||a==='toREC'){const t=a==='toINV'?'INV':'REC',n=JSON.parse(JSON.stringify(d));Object.assign(n,{id:'d'+Date.now(),type:t,no:'',status:'Draft',by:me().n,audit:[],sig:{},date:today(),created:Date.now(),from:d.id});n.f={terms:'Net 30'};
if(t==='REC'){n.items=[];n.f={inv:d.type==='INV'?d.id:'',amt:d.type==='INV'?outst(d).toFixed(2):calc(d).grand.toFixed(2),method:'Cash',txn:''};if(d.type==='BILL'){n.f.billref=d.no}}log(n,'Created from '+d.no+' (original preserved)');cur=n;return render()}
const map={submit:'Submitted',review:'Under Review',approve:'Approved',return:'Returned',reject:'Rejected',cancel:'Cancelled'};
if(a==='submit'){d.sig.prep=sg()}if(a==='review'){d.sig.chk=sg();d.checkedBy=me().n}if(a==='approve'){d.sig.auth=sg();d.approvedAt=Date.now();if(!db.sigs[me().n])c=(c?c+' · ':'')+'No signature image on file for approver'}
d.status=map[a];log(d,{submit:'Submitted for checking',review:'Review started; verified by '+me().n,approve:'Approved',return:'Returned',reject:'Rejected',cancel:'Cancelled'}[a],c);save();detail(d)}
function appr(m){const r=db.docs.filter(d=>acts(d).some(a=>['review','approve','return'].includes(a[0])));m.innerHTML=hd('Approval Centre')+`<div class="card"><p class="m">Items awaiting action by <b>${e(me().n)}</b> (${me().r}). Switch the acting user above.</p>${tbl(r)}</div>`}
// ---------- reports
function rep(m){const D=db.docs,ap=D.filter(d=>d.status==='Approved'),S=t=>ap.filter(d=>d.type===t).reduce((a,d)=>a+calc(d).grand,0),q=D.filter(d=>d.type==='QUO'&&d.status==='Approved'),cv=q.filter(x=>D.some(i=>i.from===x.id&&i.type==='INV')),pr=ap.filter(d=>d.approvedAt),avg=pr.length?pr.reduce((a,d)=>a+(d.approvedAt-d.created),0)/pr.length/36e5:0;
const R=[['Documents (all)',D.length],['Sales (approved invoices)',inr(S('INV'))],['Retail bills (approved)',inr(S('BILL'))],['Purchases (approved POs)',inr(S('PO'))],['Payments received (approved receipts)',inr(S('REC'))],['Quotations approved',q.length],['Quotations converted to invoice',cv.length+(q.length?` (${(cv.length/q.length*100).toFixed(0)}%)`:'')],['Avg processing time (create→approve)',pr.length?avg.toFixed(1)+' hrs':'n/a']];
m.innerHTML=hd('Reports','<button class="s" onclick="csv(window.RR)">Export CSV</button>')+`<div class="card tw"><table>${R.map(r=>`<tr><td>${r[0]}</td><td class="r"><b>${r[1]}</b></td></tr>`).join('')}</table></div><div class="card"><b>Document volume by type</b>${Object.keys(T).map(t=>`<div>${T[t].n}: ${D.filter(d=>d.type===t).length}</div>`).join('')}</div>`;window.RR=[['Metric','Value'],...R]}
// ---------- settings/users
function sett(m){const c=db.co;m.innerHTML=hd('Settings')+`<div class="card"><div class="g"><div><label>Company name</label><input id="s1" value="${e(c.name)}"></div><div><label>GSTIN</label><input id="s2" value="${e(c.gstin)}"></div><div><label>Address</label><input id="s3" value="${e(c.addr)}"></div><div><label>Approval workflow</label><select id="s4"><option value="1" ${c.levels<2?'selected':''}>Simple (Maker → Approver)</option><option value="2" ${c.levels>1?'selected':''}>Multi-level (Maker → Checker → Approver)</option></select></div><div><label>Logo (PNG/JPG)</label><input type="file" accept="image/png,image/jpeg" onchange="up(this,r=>{Object.assign(db.co,{name:$('s1').value,gstin:$('s2').value.trim().toUpperCase(),addr:$('s3').value,levels:+$('s4').value,logo:r});save();render()})"></div></div>${c.logo?`<img src="${c.logo}" height="50">`:''}<p class="err" id="se"></p><button onclick="if(!can('Admin'))return alert('Admin only');const g=$('s2').value.trim().toUpperCase();if(g&&!/^\\d{2}[A-Z]{5}\\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return $('se').textContent='Invalid GSTIN';Object.assign(db.co,{name:$('s1').value,gstin:g,addr:$('s3').value,levels:+$('s4').value});save();render()">Save settings</button> <button class="s d" onclick="if(confirm('Delete ALL data in this browser?')){localStorage.removeItem('docuflow');location.reload()}">Reset all data</button></div>`}
function up(el,cb){const f=el.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type)||f.size>400000)return alert('PNG/JPG under 400 KB only.');const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function users(m){m.innerHTML=hd('User Management')+`<div class="card tw"><table><tr><th>Name</th><th>Role</th><th>Designation</th><th>Signature</th><th></th></tr>${db.users.map((u,i)=>`<tr><td>${e(u.n)}</td><td>${u.r}</td><td>${e(u.d)}</td><td>${db.sigs[u.n]?`<img src="${db.sigs[u.n]}" height="30"> <button class="s" onclick="if(me().n==='${e(u.n)}'){delete db.sigs['${e(u.n)}'];save();render()}">Remove</button>`:'none'} ${me().n===u.n?`<input type="file" accept="image/png,image/jpeg" onchange="up(this,r=>{db.sigs[me().n]=r;save();render()})">`:'<span class="m">(only the owner can upload)</span>'}</td><td>${i>3?`<button class="s d" onclick="if(can('Admin')){db.users.splice(${i},1);db.me=0;save();render()}">Remove</button>`:''}</td></tr>`).join('')}</table></div>
<div class="card"><b>Add user (Admin)</b><div class="g"><input id="u1" placeholder="Name"><select id="u2"><option>Maker<option>Checker<option>Approver<option>Admin</select><input id="u3" placeholder="Designation"></div><button onclick="if(!can('Admin'))return alert('Admin only');if(!$('u1').value.trim())return;db.users.push({n:$('u1').value.trim(),r:$('u2').value,d:$('u3').value});save();render()">Add</button></div><p class="m">Signature images are applied to a document only when that user performs their own action (submit / check / approve). They are images, not legally verified digital signatures.</p>`}
// ---------- PDF preview (browser print → Save as PDF)
function prevDoc(d){const t=T[d.type],c=calc(d),ap=d.status==='Approved',co=db.co,rc=d.type==='BILL'&&d.f.fmt==='Retail receipt',p=$('pv');p.className=rc?'rc':'';
const sg=(k,l)=>{const s=d.sig[k];return`<div style="flex:1;text-align:center">${s&&s.img?`<img src="${s.img}" height="40">`:'<div style="height:40px"></div>'}<div style="border-top:1px solid #333">${l}</div>${s?e(s.name)+'<br>'+e(s.desig):''}</div>`};
p.innerHTML=`${ap?'':`<div class="wm">${d.status==='Draft'?'DRAFT':'NOT APPROVED'}</div>`}<div style="display:flex;justify-content:space-between;gap:10px"><div>${co.logo?`<img src="${co.logo}" height="45"><br>`:''}<b style="font-size:16px">${e(co.name)}</b><br>${e(co.addr)}<br>GSTIN: ${e(co.gstin)}</div><div style="text-align:right"><b style="font-size:18px">${t.n.toUpperCase()}</b><br>No: ${e(d.no)}<br>Date: ${d.date}<br>${ap?'APPROVED':e(d.status)}</div></div><hr>
<div><b>${rc?'':t.pl.replace(' (optional)','')+': '}</b>${e(d.party.name||'Walk-in')}<br>${e(d.party.addr||'')}${d.party.gstin?'<br>GSTIN: '+e(d.party.gstin):''}</div>
<div style="margin:6px 0">${t.f.filter(f=>d.f[f[0]]&&f[2]!=='inv').map(f=>f[1]+': <b>'+e(d.f[f[0]])+'</b>').join(' · ')}${t.rec?'<br>Against invoice: <b>'+e((db.docs.find(x=>x.id===d.f.inv)||{}).no)+'</b>':''}</div>
${t.rec?`<h3>Amount received: ${inr(d.f.amt)}</h3>`:`<table><tr><th>#</th><th>Item</th>${t.hsn?'<th>HSN/SAC</th>':''}<th>Qty</th><th>Rate</th><th>Disc%</th><th>GST%</th><th style="text-align:right">Amount</th></tr>${d.items.filter(i=>i.name).map((i,n)=>`<tr><td>${n+1}</td><td>${e(i.name)}</td>${t.hsn?`<td>${e(i.hsn||'')}</td>`:''}<td>${i.q}</td><td>${inr(i.p)}</td><td>${i.d||0}</td><td>${i.g||0}</td><td style="text-align:right">${inr(i.q*i.p*(1-(i.d||0)/100))}</td></tr>`).join('')}</table>
<div style="text-align:right;margin-top:8px">Subtotal: ${inr(c.sub)}<br>${c.intra===false?'IGST: '+inr(c.ig):'CGST: '+inr(c.cg)+'<br>SGST: '+inr(c.sg)}${c.ship?'<br>Shipping: '+inr(c.ship):''}${c.other?'<br>Other charges: '+inr(c.other):''}<br><b style="font-size:16px">Total: ${inr(c.grand)}</b>${d.type==='INV'?`<br>Paid: ${inr(paidOf(d))}<br><b>Balance: ${inr(outst(d))} (${pstat(d)})</b>`:''}</div>`}
${rc?'':`<div style="display:flex;gap:10px;margin-top:40px">${sg('prep','Prepared By')}${sg('chk','Checked By')}${sg('auth','Authorised Signatory')}</div>`}<p style="font-size:10px;color:#666">${ap?'Signature images shown are not legally verified digital signatures. ':''}Generated by DocuFlow. Verify GST compliance before use.</p>`;
setTimeout(()=>{try{window.print()}catch(x){alert('Printing is blocked here. Open the page in its own tab and try again.')}},100)}
render();
</script></body></html>
